<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-4 text-center text-gray-800 dark:text-gray-100">My To-Do List</h1>

        <!-- Dark Mode Toggle -->
        <div class="flex justify-end mb-4">
            <button id="dark-mode-toggle" class="text-sm bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded">
                Toggle Dark Mode
            </button>
        </div>
         <form id="task-form" class="flex flex-col sm:flex-row gap-2 mb-4">
  <input type="text" id="task-input" 
    class="flex-1 border rounded px-2 py-2 text-sm sm:text-base dark:bg-gray-700 dark:text-gray-100" 
    placeholder="Add a new task" required>
  
  <select id="task-priority" 
    class="border rounded px-2 py-2 text-sm sm:text-base dark:bg-gray-700 dark:text-gray-100">
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select>
  
  <button type="submit" 
    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    Add
  </button>
</form>

        <input type="text" id="search-input" placeholder="Search tasks..." class="w-full mb-4 px-2 py-1 border rounded dark:bg-gray-700 dark:text-gray-100">

        <!-- Task List -->
        <ul id="task-list" class="space-y-2">
            <!-- Tasks will be injected here -->
        </ul>
    </div>

    <script src="assets/script.js"></script>
</body>
</html>
